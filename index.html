<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ff4d7e;
    --pink-dark: #e83b6b;
    --pink-soft: #ffd6e2;
    --ink: #2d2a32;
    --ink-soft: #8a8590;
    --bg: #ffffff;
    --shadow-btn: 0 8px 0 var(--pink-dark), 0 14px 20px rgba(255,77,126,0.28);
    --shadow-btn-no: 0 8px 0 #d8d5dc, 0 14px 20px rgba(0,0,0,0.10);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: var(--bg);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  /* ---------- PAGE 1 ---------- */
  #page1{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    transition: opacity .35s ease;
  }

  #page1.hidden{
    opacity: 0;
    pointer-events: none;
  }

  .eyebrow{
    font-family: 'Caveat', cursive;
    font-size: clamp(20px, 4vw, 28px);
    color: var(--pink);
    margin: 0 0 6px 0;
    letter-spacing: 0.5px;
  }

  .headline{
    font-size: clamp(24px, 5.4vw, 40px);
    font-weight: 700;
    line-height: 1.35;
    max-width: 620px;
    margin: 0 0 42px 0;
  }

  .headline .soft{
    color: var(--ink-soft);
    font-weight: 600;
  }

  .intro-card{
    background: #fff;
    border-radius: 32px;
    padding: 56px 46px;
    max-width: 560px;
    width: 90vw;
    box-shadow: 0 18px 0 var(--pink-soft), 0 30px 50px rgba(255,77,126,0.22);
  }

  .btn-row{
    display: flex;
    gap: 22px;
    align-items: center;
    justify-content: center;
  }

  .btn{
    border: none;
    outline: none;
    cursor: pointer;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 18px;
    padding: 16px 38px;
    border-radius: 999px;
    background: #fff;
    color: var(--ink-soft);
    box-shadow: var(--shadow-btn-no);
    transform: translateY(0) scale(1);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, background .2s ease, color .2s ease;
  }

  .btn:hover{
    transform: translateY(-3px) scale(1.04);
  }

  .btn:active{
    transform: translateY(1px) scale(0.97);
  }

  .btn:focus-visible{
    transform: translateY(-4px) scale(1.08);
  }

  .btn-yes-see{
    background: linear-gradient(180deg, #ff5c8a, var(--pink));
    color: #fff;
    box-shadow: var(--shadow-btn);
  }

  /* heartbeat pulse rhythm — lub-dub, like a real heartbeat */
  .heartbeat{
    --s: 1;
    animation: heartbeatPulse 1.15s ease-in-out infinite;
  }

  @keyframes heartbeatPulse{
    0%, 100%   { transform: scale(var(--s, 1)); }
    14%        { transform: scale(calc(var(--s, 1) * 1.14)); }
    28%        { transform: scale(var(--s, 1)); }
    42%        { transform: scale(calc(var(--s, 1) * 1.14)); }
    70%        { transform: scale(var(--s, 1)); }
  }

  .burst-emoji{
    position: fixed;
    pointer-events: none;
    z-index: 999;
    transition: transform 0.85s cubic-bezier(.25,.8,.4,1), opacity 0.85s ease-out;
    will-change: transform, opacity;
  }

  .close-btn{
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: #fff;
    color: var(--ink-soft);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 var(--pink-soft), 0 8px 14px rgba(255,77,126,0.2);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), color .2s ease;
  }

  .close-btn:hover{
    transform: translateY(-2px) scale(1.08);
    color: var(--pink-dark);
  }

  .close-btn:active{
    transform: translateY(1px) scale(0.95);
  }

  .back-btn{
    position: absolute;
    top: 18px;
    right: 20px;
    border: none;
    background: #fff;
    color: var(--pink-dark);
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--pink-soft), 0 8px 14px rgba(255,77,126,0.2);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), color .2s ease;
  }

  .back-btn:hover{
    transform: translateY(-2px) scale(1.06);
  }

  .back-btn:active{
    transform: translateY(1px) scale(0.95);
  }

  .back-btn.top-left{
    left: 20px;
    right: auto;
  }

  .wanna-btn{
    margin-top: 22px;
    background: #fff;
    color: var(--pink-dark);
    border: 2px solid var(--pink-soft);
    box-shadow: 0 6px 0 var(--pink-soft), 0 10px 16px rgba(255,77,126,0.18);
  }

  /* ---- Blooming rose bouquet ---- */
  .bouquet{
    position: relative;
    height: 130px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    margin: 6px auto 2px;
  }

  .bouquet .rose{
    display: inline-block;
    font-size: 40px;
    opacity: 0;
    transform: scale(0.2) rotate(-15deg) translateY(10px);
    transform-origin: bottom center;
  }

  .bouquet.bloom .rose{
    animation: roseBloom .6s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .bouquet .rose:nth-child(1){ font-size: 32px; }
  .bouquet.bloom .rose:nth-child(1){ animation-delay: .05s; }
  .bouquet .rose:nth-child(2){ font-size: 42px; }
  .bouquet.bloom .rose:nth-child(2){ animation-delay: .2s; }
  .bouquet .rose:nth-child(3){ font-size: 50px; }
  .bouquet.bloom .rose:nth-child(3){ animation-delay: .35s; }
  .bouquet .rose:nth-child(4){ font-size: 42px; }
  .bouquet.bloom .rose:nth-child(4){ animation-delay: .5s; }
  .bouquet .rose:nth-child(5){ font-size: 32px; }
  .bouquet.bloom .rose:nth-child(5){ animation-delay: .65s; }

  .bouquet .bow{
    position: absolute;
    bottom: -6px;
    font-size: 30px;
    opacity: 0;
    transform: scale(0.2);
  }

  .bouquet.bloom .bow{
    animation: roseBloom .5s cubic-bezier(.34,1.56,.64,1) .82s forwards;
  }

  @keyframes roseBloom{
    0%   { opacity: 0; transform: scale(0.2) rotate(-15deg) translateY(10px); }
    60%  { opacity: 1; transform: scale(1.15) rotate(4deg) translateY(-4px); }
    100% { opacity: 1; transform: scale(1) rotate(0deg) translateY(0); }
  }

  .rose-caption{
    font-size: 18px;
    font-weight: 700;
    margin: 6px 0 4px 0;
  }

  #fingerOverlay{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 70;
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s ease;
  }

  #fingerOverlay.visible{
    opacity: 1;
  }

  .finger-emoji{
    font-size: 44px;
    display: inline-block;
    transform: scale(0);
    filter: drop-shadow(0 10px 16px rgba(0,0,0,0.25));
  }

  .finger-emoji.pop{
    animation: fingerPop .75s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  @keyframes fingerPop{
    0%   { transform: scale(0) rotate(-25deg); opacity: 0; }
    55%  { transform: scale(1.6) rotate(10deg); opacity: 1; }
    75%  { transform: scale(1.3) rotate(-4deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(0deg); opacity: 1; }
  }

  /* ---- Back-message overlay ---- */
  #backOverlay, #roseOverlay{
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 60;
  }

  #backOverlay.visible, #roseOverlay.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .back-message-card{
    position: relative;
    background: #fff;
    border-radius: 32px;
    padding: 50px 34px 30px;
    max-width: 420px;
    width: 88vw;
    text-align: center;
    box-shadow: 0 18px 0 var(--pink-soft), 0 30px 60px rgba(255,77,126,0.3);
    transform: scale(0.6) translateY(20px);
    opacity: 0;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
  }

  .back-message-card.pop{
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .back-message-card p{
    font-size: 18px;
    line-height: 1.6;
    font-weight: 600;
    margin: 0 0 24px 0;
  }

  .message-slot-wrap{
    position: relative;
  }

  .message-slot{
    width: 100%;
    min-height: 90px;
    max-height: 160px;
    border: 2px solid var(--pink-soft);
    border-radius: 22px;
    padding: 14px 56px 14px 16px;
    font-family: 'Quicksand', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    resize: none;
    outline: none;
    box-shadow: 0 6px 0 var(--pink-soft), 0 10px 18px rgba(255,77,126,0.14);
    transition: box-shadow .2s ease, border-color .2s ease;
  }

  .message-slot::placeholder{
    color: var(--ink-soft);
    font-weight: 500;
  }

  .message-slot:focus{
    border-color: var(--pink);
    box-shadow: 0 6px 0 var(--pink-soft), 0 12px 22px rgba(255,77,126,0.24);
  }

  .send-btn{
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(180deg, #ff5c8a, var(--pink));
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 var(--pink-dark), 0 10px 16px rgba(255,77,126,0.3);
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }

  .send-btn:hover{
    transform: translateY(-2px) scale(1.08);
  }

  .send-btn:active{
    transform: translateY(1px) scale(0.93);
  }

  .sent-note{
    margin-top: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--pink-dark);
    opacity: 0;
    transition: opacity .3s ease;
  }

  .sent-note.show{
    opacity: 1;
  }

  #noBtn{
    position: relative;
    z-index: 5;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, top .35s cubic-bezier(.34,1.56,.64,1), left .35s cubic-bezier(.34,1.56,.64,1);
  }

  #noBtn.roaming{
    position: fixed;
  }

  /* ---------- PAGE 2 (the "card" the See it button grows into) ---------- */
  #page2{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }

  #page2.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .card{
    position: relative;
    background: #fff;
    border-radius: 32px;
    padding: 56px 46px;
    max-width: 480px;
    width: 88vw;
    text-align: center;
    box-shadow: 0 18px 0 var(--pink-soft), 0 30px 50px rgba(255,77,126,0.22);
    transform: scale(0.4);
    opacity: 0;
    transition: transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
  }

  .card.pop{
    transform: scale(1);
    opacity: 1;
  }

  .card h2{
    font-size: clamp(22px, 4.6vw, 30px);
    margin: 0 0 34px 0;
    line-height: 1.4;
  }

  .card-row{
    display: flex;
    gap: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }

  #yesLoveBtn{
    transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, background .2s ease, color .2s ease;
  }

  /* ---------- FINAL OVERLAY ---------- */
  #finalOverlay{
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease;
    z-index: 50;
  }

  #finalOverlay.visible{
    opacity: 1;
    pointer-events: auto;
  }

  .final-card{
    position: relative;
    background: #fff;
    border-radius: 32px;
    padding: 52px 40px 44px;
    max-width: 420px;
    width: 86vw;
    text-align: center;
    box-shadow: 0 18px 0 var(--pink-soft), 0 30px 60px rgba(255,77,126,0.3);
    transform: scale(0.6) translateY(20px);
    opacity: 0;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
  }

  .final-card.pop{
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .final-card h2{
    font-family: 'Caveat', cursive;
    font-size: 44px;
    color: var(--pink-dark);
    margin: 0 0 18px 0;
  }

  /* ---- Illustrated kissing-cat sticker ---- */
  .cat-sticker{
    width: 128px;
    height: 128px;
    margin: 4px auto 6px;
    animation: catSway 2.4s ease-in-out infinite;
    filter: drop-shadow(0 10px 14px rgba(255,77,126,0.28));
  }

  @keyframes catSway{
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50%      { transform: rotate(4deg) translateY(-3px); }
  }

  .cat-mouth{
    animation: catPucker 1.2s ease-in-out infinite;
    transform-origin: 64px 78px;
  }

  @keyframes catPucker{
    0%, 60%, 100% { transform: scale(1); }
    20%           { transform: scale(1.3); }
    35%           { transform: scale(0.85); }
  }

  .kiss-heart{
    opacity: 0;
    animation: kissHeartFly 1.2s ease-out infinite;
  }

  @keyframes kissHeartFly{
    0%   { opacity: 0; transform: translate(0, 0) scale(0.3); }
    15%  { opacity: 1; transform: translate(6px, -4px) scale(0.8); }
    100% { opacity: 0; transform: translate(30px, -34px) scale(1.15); }
  }

  .heart-wrap{
    position: relative;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .heart{
    font-size: 64px;
    display: inline-block;
    animation: beat 1.05s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(255,77,126,0.4));
  }

  @keyframes beat{
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(0.92); }
    45% { transform: scale(1.15); }
    60% { transform: scale(1); }
  }

  .float-emoji{
    position: absolute;
    bottom: 10px;
    font-size: 20px;
    opacity: 0;
    animation: floatUp 2.6s ease-in infinite;
  }

  @keyframes floatUp{
    0%{ opacity: 0; transform: translateY(0) translateX(0) scale(0.6) rotate(0deg); }
    15%{ opacity: 1; }
    100%{ opacity: 0; transform: translateY(-120px) translateX(var(--drift, 20px)) scale(1.1) rotate(20deg); }
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .float-emoji, .btn, #noBtn, .cat-sticker, .cat-mouth, .kiss-heart, .bouquet .rose, .bouquet .bow, .finger-emoji{
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">

  <!-- PAGE 1 -->
  <div id="page1">
    <div class="intro-card">
      <p class="eyebrow">psst... come here for a sec</p>
      <h1 class="headline">
        Hello, I'm going to ask a<br>
        <span class="soft">really important</span> question.<br>
        Do you want to see it?
      </h1>
      <div class="btn-row">
        <button class="btn btn-yes-see heartbeat" id="seeBtn">See it</button>
        <button class="btn" id="noBtn">No</button>
      </div>
    </div>
  </div>

  <!-- PAGE 2 (grown card) -->
  <div id="page2">
    <div class="card" id="loveCard">
      <button class="back-btn top-left" id="restartBtn" style="display:none;">↺ Restart</button>
      <button class="back-btn" id="backBtn" style="display:none;">Wanna Breakup</button>
      <h2>Do you really love me? 🥺</h2>
      <div class="card-row">
        <button class="btn btn-yes-see heartbeat" id="yesLoveBtn">Yes</button>
        <button class="btn" id="noLoveBtn">No</button>
      </div>
    </div>
  </div>

</div>

<!-- FINAL OVERLAY -->
<div id="finalOverlay">
  <div class="final-card" id="finalCard">
    <button class="back-btn top-left" id="backFinalBtn">← Back</button>
    <button class="close-btn" id="closeFinalBtn" aria-label="Close">✕</button>

    <svg class="cat-sticker" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-label="Cute cat blowing a kiss">
      <!-- ears -->
      <path d="M28 40 L18 8 L52 30 Z" fill="#ffb6c9"/>
      <path d="M100 40 L110 8 L76 30 Z" fill="#ffb6c9"/>
      <path d="M31 36 L24 16 L48 30 Z" fill="#ff8aa8"/>
      <path d="M97 36 L104 16 L80 30 Z" fill="#ff8aa8"/>
      <!-- face -->
      <circle cx="64" cy="68" r="46" fill="#fff1f4"/>
      <circle cx="64" cy="68" r="46" fill="none" stroke="#ffb6c9" stroke-width="3"/>
      <!-- blush -->
      <ellipse cx="32" cy="78" rx="10" ry="6" fill="#ffc2d1" opacity="0.85"/>
      <ellipse cx="96" cy="78" rx="10" ry="6" fill="#ffc2d1" opacity="0.85"/>
      <!-- closed happy eyes -->
      <path d="M40 60 Q47 52 54 60" fill="none" stroke="#2d2a32" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M74 60 Q81 52 88 60" fill="none" stroke="#2d2a32" stroke-width="3.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M8 66 L30 68 M8 76 L30 74" stroke="#f2a7bd" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M120 66 L98 68 M120 76 L98 74" stroke="#f2a7bd" stroke-width="2.5" stroke-linecap="round"/>
      <!-- nose -->
      <path d="M60 70 L68 70 L64 75 Z" fill="#ff6f91"/>
      <!-- puckered kissing mouth -->
      <g class="cat-mouth">
        <ellipse cx="64" cy="80" rx="6" ry="5.5" fill="#ff6f91"/>
      </g>
      <!-- little heart flying from the kiss -->
      <text class="kiss-heart" x="70" y="72" font-size="16">💕</text>
    </svg>

    <h2>I knew it.</h2>
    <div class="heart-wrap" id="heartWrap">
      <span class="heart">❤️</span>
    </div>
    <button class="btn wanna-btn" id="wannaSurpriseBtn">Wanna Surprise</button>
  </div>
</div>

<!-- ROSE SURPRISE OVERLAY -->
<div id="roseOverlay">
  <div class="back-message-card" id="roseCard">
    <button class="back-btn" id="roseBackBtn">← Back</button>
    <div class="bouquet" id="bouquet">
      <span class="rose">🌹</span>
      <span class="rose">🌹</span>
      <span class="rose">🌹</span>
      <span class="rose">🌹</span>
      <span class="rose">🌹</span>
      <span class="bow">🎀</span>
    </div>
    <p class="rose-caption">Here, this is for U 😏</p>
  </div>
</div>

<!-- REACTION EMOJI OVERLAY (plays before the message-slot card) -->
<div id="fingerOverlay">
  <span class="finger-emoji" id="fingerEmoji">🖕</span>
</div>

<!-- BACK-MESSAGE OVERLAY -->
<div id="backOverlay">
  <div class="back-message-card" id="backMessageCard">
    <button class="close-btn" id="closeBackBtn" aria-label="Close">✕</button>
    <p>Yes dunnanm Idam, Dn Karanna deyak na. Ubrge Karume thama 😊</p>
    <div class="message-slot-wrap">
      <textarea class="message-slot" id="messageSlot" placeholder="Type your message..."></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send message">➤</button>
    </div>
    <div class="sent-note" id="sentNote">Sent 💌</div>
  </div>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const seeBtn = document.getElementById('seeBtn');
  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  const loveCard = document.getElementById('loveCard');
  const yesLoveBtn = document.getElementById('yesLoveBtn');
  const noLoveBtn = document.getElementById('noLoveBtn');
  const finalOverlay = document.getElementById('finalOverlay');
  const finalCard = document.getElementById('finalCard');
  const heartWrap = document.getElementById('heartWrap');
  const closeFinalBtn = document.getElementById('closeFinalBtn');
  const backFinalBtn = document.getElementById('backFinalBtn');
  const wannaSurpriseBtn = document.getElementById('wannaSurpriseBtn');
  const roseOverlay = document.getElementById('roseOverlay');
  const roseCard = document.getElementById('roseCard');
  const roseBackBtn = document.getElementById('roseBackBtn');
  const bouquet = document.getElementById('bouquet');
  const backBtn = document.getElementById('backBtn');
  const restartBtn = document.getElementById('restartBtn');
  const fingerOverlay = document.getElementById('fingerOverlay');
  const fingerEmoji = document.getElementById('fingerEmoji');
  const backOverlay = document.getElementById('backOverlay');
  const backMessageCard = document.getElementById('backMessageCard');
  const closeBackBtn = document.getElementById('closeBackBtn');
  const messageSlot = document.getElementById('messageSlot');
  const sendBtn = document.getElementById('sendBtn');
  const sentNote = document.getElementById('sentNote');

  /* ---- Burst of pink hearts & flowers from a button, gone after each click ---- */
  const burstEmojis = ['💗','💕','💖','🌸','🌷','🌺','💐'];

  function burstFrom(el){
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const count = 10;

    for(let i = 0; i < count; i++){
      const span = document.createElement('span');
      span.className = 'burst-emoji';
      span.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];
      span.style.left = cx + 'px';
      span.style.top = cy + 'px';
      span.style.fontSize = (14 + Math.random() * 12) + 'px';
      span.style.transform = 'translate(-50%, -50%) scale(0.4)';
      span.style.opacity = '1';
      document.body.appendChild(span);

      const angle = Math.random() * Math.PI * 2;
      const dist = 55 + Math.random() * 75;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 30;
      const rot = (Math.random() * 300 - 150).toFixed(0);
      const scale = (0.7 + Math.random() * 0.8).toFixed(2);

      requestAnimationFrame(() => {
        span.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${scale}) rotate(${rot}deg)`;
        span.style.opacity = '0';
      });

      setTimeout(() => span.remove(), 900);
    }
  }

  /* ---- Page 1: "No" button runs away ---- */
  function moveNoRandomly(){
    burstFrom(noBtn);

    const btnRect = noBtn.getBoundingClientRect();
    const w = btnRect.width || 120;
    const h = btnRect.height || 56;
    const margin = 20;

    const maxX = window.innerWidth - w - margin;
    const maxY = window.innerHeight - h - margin;

    const randX = Math.max(margin, Math.random() * maxX);
    const randY = Math.max(margin, Math.random() * maxY);

    if(!noBtn.classList.contains('roaming')){
      noBtn.classList.add('roaming');
    }
    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  }

  noBtn.addEventListener('click', moveNoRandomly);
  noBtn.addEventListener('touchstart', function(e){ e.preventDefault(); moveNoRandomly(); }, { passive:false });

  /* ---- "See it" grows into the love-question card ---- */
  seeBtn.addEventListener('click', () => {
    burstFrom(seeBtn);
    page1.classList.add('hidden');
    page2.classList.add('visible');
    requestAnimationFrame(() => {
      loveCard.classList.add('pop');
    });
  });

  /* ---- "Do you really love me?" No button: Yes button grows each tap, keeps its heartbeat rhythm ---- */
  let yesScale = 1;
  noLoveBtn.addEventListener('click', () => {
    burstFrom(noLoveBtn);
    yesScale += 0.22;
    yesLoveBtn.style.setProperty('--s', yesScale);
    yesLoveBtn.style.zIndex = 10;
  });

  /* ---- Yes -> blurred overlay + "I knew it" + beating heart ---- */
  const floatEmojis = ['❤️','💕','💖','😍','💗'];

  function spawnFloatingEmoji(){
    const span = document.createElement('span');
    span.className = 'float-emoji';
    span.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
    const drift = (Math.random() * 100 - 50) + 'px';
    span.style.setProperty('--drift', drift);
    span.style.left = (35 + Math.random() * 30) + '%';
    span.style.animationDuration = (2 + Math.random() * 1.4) + 's';
    heartWrap.appendChild(span);
    setTimeout(() => span.remove(), 3600);
  }

  let floatingInterval = null;

  yesLoveBtn.addEventListener('click', () => {
    burstFrom(yesLoveBtn);
    backBtn.style.display = 'inline-flex';
    restartBtn.style.display = 'inline-flex';
    finalOverlay.classList.add('visible');
    requestAnimationFrame(() => finalCard.classList.add('pop'));
    if(!floatingInterval){
      spawnFloatingEmoji();
      floatingInterval = setInterval(spawnFloatingEmoji, 450);
    }
  });

  /* ---- Shared: return to the "Do you really love me?" card from any overlay on top of it ---- */
  function goToLoveCard(){
    finalOverlay.classList.remove('visible');
    finalCard.classList.remove('pop');
    roseOverlay.classList.remove('visible');
    roseCard.classList.remove('pop');
    if(floatingInterval){
      clearInterval(floatingInterval);
      floatingInterval = null;
    }
    yesScale = 1;
    yesLoveBtn.style.setProperty('--s', 1);
    yesLoveBtn.style.zIndex = '';
  }

  backFinalBtn.addEventListener('click', () => {
    burstFrom(backFinalBtn);
    goToLoveCard();
  });

  /* ---- Wanna Surprise -> blooming rose bouquet card ---- */
  wannaSurpriseBtn.addEventListener('click', () => {
    burstFrom(wannaSurpriseBtn);
    roseOverlay.classList.add('visible');
    requestAnimationFrame(() => roseCard.classList.add('pop'));

    bouquet.classList.remove('bloom');
    void bouquet.offsetWidth; // restart the bloom animation each time it opens
    bouquet.classList.add('bloom');
  });

  roseBackBtn.addEventListener('click', () => {
    burstFrom(roseBackBtn);
    goToLoveCard();
  });

  /* ---- Close the final popup: also reset the Yes button back to its original size ---- */
  closeFinalBtn.addEventListener('click', () => {
    finalOverlay.classList.remove('visible');
    finalCard.classList.remove('pop');
    if(floatingInterval){
      clearInterval(floatingInterval);
      floatingInterval = null;
    }
    yesScale = 1;
    yesLoveBtn.style.setProperty('--s', 1);
    yesLoveBtn.style.zIndex = '';
  });

  /* ---- "Wanna Breakup" button: flash a middle-finger reaction, then pop the message-slot card ---- */
  backBtn.addEventListener('click', () => {
    burstFrom(backBtn);

    fingerEmoji.classList.remove('pop');
    void fingerEmoji.offsetWidth; // restart animation each tap
    fingerOverlay.classList.add('visible');
    fingerEmoji.classList.add('pop');

    setTimeout(() => {
      fingerOverlay.classList.remove('visible');
      fingerEmoji.classList.remove('pop');

      backOverlay.classList.add('visible');
      requestAnimationFrame(() => backMessageCard.classList.add('pop'));
    }, 800);
  });

  closeBackBtn.addEventListener('click', () => {
    backOverlay.classList.remove('visible');
    backMessageCard.classList.remove('pop');
    sentNote.classList.remove('show');
  });

  sendBtn.addEventListener('click', async () => {
    const text = messageSlot.value.trim();
    if(!text) return;

    burstFrom(sendBtn);
    sendBtn.disabled = true;

    try {
      const formData = new FormData();
      formData.append('message', text);
      formData.append('_subject', 'A little reply for you 💌');
      formData.append('_captcha', 'false');
      formData.append('_template', 'box');

      const response = await fetch('https://formsubmit.co/ajax/nethrayasas026@gmail.com', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: formData
      });

      sentNote.textContent = response.ok ? 'Sent 💌' : "Couldn't send, try again";
    } catch (err) {
      sentNote.textContent = "Couldn't send, try again";
    }

    sentNote.classList.add('show');
    messageSlot.value = '';
    sendBtn.disabled = false;
    setTimeout(() => sentNote.classList.remove('show'), 2500);
  });

  /* ---- Restart: back to the very first page, everything reset ---- */
  restartBtn.addEventListener('click', () => {
    burstFrom(restartBtn);

    // close every overlay
    finalOverlay.classList.remove('visible');
    finalCard.classList.remove('pop');
    roseOverlay.classList.remove('visible');
    roseCard.classList.remove('pop');
    backOverlay.classList.remove('visible');
    backMessageCard.classList.remove('pop');
    fingerOverlay.classList.remove('visible');
    fingerEmoji.classList.remove('pop');
    sentNote.classList.remove('show');
    messageSlot.value = '';
    if(floatingInterval){
      clearInterval(floatingInterval);
      floatingInterval = null;
    }

    // go back to page 1
    page2.classList.remove('visible');
    loveCard.classList.remove('pop');
    page1.classList.remove('hidden');

    // reset the wandering No button
    noBtn.classList.remove('roaming');
    noBtn.style.left = '';
    noBtn.style.top = '';

    // reset the Yes button size
    yesScale = 1;
    yesLoveBtn.style.setProperty('--s', 1);
    yesLoveBtn.style.zIndex = '';

    // hide Back/Restart again until Yes is picked next time
    backBtn.style.display = 'none';
    restartBtn.style.display = 'none';
  });
</script>

</body>
</html>
